services:
  spark-master:
    image: apache/spark:3.5.9-scala2.12-java17-python3-r-ubuntu
    container_name: spark-master
    cpuset: "0-1"
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    env_file:
      - ./config/pipeline_rules.env
    volumes:
      - ./jobs:/opt/spark/work-dir/jobs
      - ./config:/opt/spark/work-dir/config
      - ./scripts:/opt/spark/work-dir/scripts
    ports:
      - "8080:8080"
      - "7077:7077"
      - "4040:4040"
    deploy:
      resources:
        limits:
          memory: 512M

  spark-worker:
    image: apache/spark:3.5.9-scala2.12-java17-python3-r-ubuntu
    container_name: spark-worker
    cpuset: "0-1"
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    env_file:
      - ./config/pipeline_rules.env
    volumes:
      - ./jobs:/opt/spark/work-dir/jobs
      - ./config:/opt/spark/work-dir/config
      - ./scripts:/opt/spark/work-dir/scripts
    depends_on:
      - spark-master
    deploy:
      resources:
        limits:
          memory: 1G

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_NUM_PARTITIONS=3
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
      - KAFKA_HEAP_OPTS=-Xmx512m -Xms512m
    ports:
      - "9092:29092"
    deploy:
      resources:
        limits:
          memory: 1G

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    ports:
      - "8081:8080"
    depends_on:
      - kafka
    deploy:
      resources:
        limits:
          memory: 256M

  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    volumes:
      - ./queries:/queries
    environment:
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=128M
    ports:
      - "9042:9042"
    deploy:
      resources:
        limits:
          memory: 1G

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    deploy:
      resources:
        limits:
          memory: 512M

  ingest-consumer:
    image: apache/spark:3.5.9-scala2.12-java17-python3-r-ubuntu
    container_name: ingest-consumer
    command: python3 /opt/spark/work-dir/jobs/consume_stream.py
    environment:
      - KAFKA_BROKER=kafka:9092
      - PYTHONUNBUFFERED=1
    volumes:
      - ./jobs:/opt/spark/work-dir/jobs
    depends_on:
      - kafka

networks:
  default:
    name: little-big-data-env_default
