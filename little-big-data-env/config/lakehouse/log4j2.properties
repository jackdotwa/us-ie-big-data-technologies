# Lakehouse profile: driver logging, for spark-submit and notebooks alike. Logging only: it changes
# nothing about how a job runs. Based on Spark 3.5's built-in defaults (log4j2-defaults.properties),
# with the root level at WARN (what Spark already uses in interactive sessions) so your own output
# and real errors stand out.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

logger.jetty2.name = org.sparkproject.jetty.util.component.AbstractLifeCycle
logger.jetty2.level = error
logger.parquet.name = org.apache.parquet.CorruptStatistics
logger.parquet.level = error

# Harmless warnings this stack prints on every run:
# Iceberg's file-based catalog looks for metadata/version-hint.text before a new table exists.
logger.iceberg_hint.name = org.apache.iceberg.hadoop.HadoopTableOperations
logger.iceberg_hint.level = error
# The event log is written to S3, which has no hflush/hsync.
logger.s3a_syncable.name = org.apache.hadoop.fs.s3a.S3ABlockOutputStream
logger.s3a_syncable.level = error
# No Hadoop metrics configuration and no native Hadoop library in the image.
logger.metrics.name = org.apache.hadoop.metrics2.impl.MetricsConfig
logger.metrics.level = error
logger.native.name = org.apache.hadoop.util.NativeCodeLoader
logger.native.level = error
