# Lakehouse profile: fixed Spark configuration. Do not override these in your code.
# Every run records them in its event log (SparkListenerEnvironmentUpdate), so changes show.

spark.master                                 spark://spark-master:7077

# Two workers, 2 cores and 2 GiB each: one executor per worker.
spark.driver.memory                          1g
spark.executor.memory                        1600m
spark.executor.cores                         2
spark.cores.max                              4
# Off-heap (direct) buffers default to the heap size and are freed only at GC; capped so an executor
# stays inside its worker container (2.75 GiB). Heap, cores and spill behaviour are unchanged.
spark.executor.extraJavaOptions              -XX:MaxDirectMemorySize=512m

# Iceberg and S3A jars, mounted on every container.
spark.driver.extraClassPath                  /opt/spark/lakehouse-jars/*
spark.executor.extraClassPath                /opt/spark/lakehouse-jars/*

# The S3 object store (SeaweedFS) through S3A.
spark.hadoop.fs.s3a.endpoint                 http://seaweedfs:8333
spark.hadoop.fs.s3a.access.key               bdtadmin
spark.hadoop.fs.s3a.secret.key               bdtadmin
spark.hadoop.fs.s3a.path.style.access        true
spark.hadoop.fs.s3a.connection.ssl.enabled   false
spark.hadoop.fs.s3a.impl                     org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# Every run writes its event log to the logs bucket.
spark.eventLog.enabled                       true
spark.eventLog.dir                           s3a://logs/spark-events

# Iceberg: a file-based (Hadoop) catalog called `lake` in the warehouse bucket. Using it is optional.
spark.sql.extensions                         org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lake                       org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type                  hadoop
spark.sql.catalog.lake.warehouse             s3a://warehouse/iceberg

# Iceberg's Arrow-vectorised Parquet reader crashes the JVM (SIGSEGV in the C2 compiler) on
# aarch64 / Temurin 17.0.19 once its reader code gets hot. Off for everyone so every machine
# runs the same plan. Spark's own Parquet vectorised reader is unaffected.
spark.sql.iceberg.vectorization.enabled      false

# Adaptive query execution stays at Spark's default (on). Nothing else is tuned.
