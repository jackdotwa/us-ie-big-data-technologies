# Profiles: nothing starts without one. Pick what the work needs, for example
#   docker compose --profile analytics up -d    # Spark, Kafka, Kafka UI, Cassandra, Qdrant (the course's lab stack)
#   docker compose --profile streaming up -d    # Spark, Kafka, Kafka UI and the stream consumer
#   docker compose --profile spark up -d        # Spark master and worker only
#   docker compose --profile lakehouse up -d    # S3 object store, Spark with two workers, Iceberg (8 GiB in all)
# Naming a service starts it whatever its profile, e.g. `docker compose up -d postgres mongo`.

x-lakehouse-spark: &lakehouse-spark
  image: apache/spark:3.5.9-scala2.12-java17-python3-r-ubuntu
  profiles: ["lakehouse"]
  restart: unless-stopped
  volumes:
    - ./config/lakehouse/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    - ./jars/lakehouse:/opt/spark/lakehouse-jars:ro

services:
  spark-master:
    profiles: ["analytics", "streaming", "spark", "lakehouse"]
    image: apache/spark:3.5.9-scala2.12-java17-python3-r-ubuntu
    container_name: spark-master
    cpuset: "0-1"
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    env_file:
      - ./config/pipeline_rules.env
    volumes:
      - ./jobs:/opt/spark/work-dir/jobs
      - ./config:/opt/spark/work-dir/config
      - ./scripts:/opt/spark/work-dir/scripts
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:7077:7077"
      - "127.0.0.1:4040:4040"
    deploy:
      resources:
        limits:
          memory: 512M

  spark-worker:
    profiles: ["analytics", "streaming", "spark"]
    image: apache/spark:3.5.9-scala2.12-java17-python3-r-ubuntu
    container_name: spark-worker
    cpuset: "0-1"
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    env_file:
      - ./config/pipeline_rules.env
    volumes:
      - ./jobs:/opt/spark/work-dir/jobs
      - ./config:/opt/spark/work-dir/config
      - ./scripts:/opt/spark/work-dir/scripts
    depends_on:
      - spark-master
    deploy:
      resources:
        limits:
          memory: 1G

  kafka:
    profiles: ["analytics", "streaming"]
    image: apache/kafka:3.7.0
    container_name: kafka
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_NUM_PARTITIONS=3
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
      - KAFKA_HEAP_OPTS=-Xmx512m -Xms512m
    ports:
      - "127.0.0.1:9092:29092"
    deploy:
      resources:
        limits:
          memory: 1G

  kafka-ui:
    profiles: ["analytics", "streaming"]
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - kafka
    deploy:
      resources:
        limits:
          memory: 256M

  cassandra:
    profiles: ["analytics"]
    image: cassandra:4.1
    container_name: cassandra
    environment:
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=128M
    ports:
      - "127.0.0.1:9042:9042"
    deploy:
      resources:
        limits:
          memory: 1G

  qdrant:
    profiles: ["analytics"]
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    deploy:
      resources:
        limits:
          memory: 512M

  ingest-consumer:
    profiles: ["analytics", "streaming"]
    image: apache/spark:3.5.9-scala2.12-java17-python3-r-ubuntu
    container_name: ingest-consumer
    command: python3 /opt/spark/work-dir/jobs/consume_stream.py
    environment:
      - KAFKA_BROKER=kafka:9092
      - PYTHONUNBUFFERED=1
    volumes:
      - ./jobs:/opt/spark/work-dir/jobs
    depends_on:
      - kafka

  # ---- lakehouse: S3 object store (SeaweedFS) + Spark with two workers + a driver, 8 GiB in all ----
  # The Spark configuration in config/lakehouse/spark-defaults.conf is fixed; every run's event
  # log records the configuration it ran with.

  # S3-compatible object store (SeaweedFS: master, volume, filer and S3 gateway in one process).
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    container_name: seaweedfs
    profiles: ["lakehouse"]
    restart: unless-stopped
    command: >
      server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=512 -volume.max=100
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - seaweedfs-data:/data
      - ./config/lakehouse/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:9333:9333"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9333/cluster/healthz"]
      interval: 5s
      retries: 30
    # 1 GiB: at 768 MiB it was OOM-killed streaming an 88 MB event log to several readers at once.
    deploy:
      resources:
        limits:
          memory: 1024M

  # Creates the four buckets once the S3 gateway answers, then exits.
  seaweedfs-init:
    image: rclone/rclone:1.75.2
    container_name: seaweedfs-init
    profiles: ["lakehouse"]
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      - RCLONE_CONFIG_S3_TYPE=s3
      - RCLONE_CONFIG_S3_PROVIDER=SeaweedFS
      - RCLONE_CONFIG_S3_ENDPOINT=http://seaweedfs:8333
      - RCLONE_CONFIG_S3_ACCESS_KEY_ID=bdtadmin
      - RCLONE_CONFIG_S3_SECRET_ACCESS_KEY=bdtadmin
    entrypoint: >
      /bin/sh -c "
      until rclone lsd s3: >/dev/null 2>&1; do sleep 2; done &&
      for b in landing warehouse output logs; do rclone mkdir s3:$$b; done &&
      rclone touch s3:logs/spark-events/.keep && rclone lsd s3:"
    deploy:
      resources:
        limits:
          memory: 128M

  # Two workers, 2 cores and 2 GiB each, registered with the shared spark-master.
  lakehouse-worker-1: &lakehouse-worker
    <<: *lakehouse-spark
    container_name: lakehouse-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker --cores 2 --memory 2g spark://spark-master:7077
    environment:
      - SPARK_DAEMON_MEMORY=256m
    depends_on:
      - spark-master
    deploy:
      resources:
        limits:
          memory: 2560M

  lakehouse-worker-2:
    <<: *lakehouse-worker
    container_name: lakehouse-worker-2

  # Where you run spark-submit, with your repository (REPO_DIR) mounted at /workspace.
  lakehouse-driver:
    <<: *lakehouse-spark
    container_name: lakehouse-driver
    user: root
    working_dir: /workspace
    command: sleep infinity
    environment:
      - PATH=/opt/spark/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - PYTHONUNBUFFERED=1
    volumes:
      - ./config/lakehouse/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./jars/lakehouse:/opt/spark/lakehouse-jars:ro
      # The environment's own jobs (the smoke test), wherever REPO_DIR points.
      - ./jobs:/opt/lakehouse/jobs:ro
      - ${REPO_DIR:-..}:/workspace
    ports:
      - "127.0.0.1:4041:4040"
    depends_on:
      - spark-master
      - seaweedfs-init
    deploy:
      resources:
        limits:
          memory: 1280M

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    profiles: ["pb1"]
    environment:
      - POSTGRES_DB=bdt_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - ../relational-usecases/postgres-sensor-obt/seeds:/seeds:ro
    deploy:
      resources:
        limits:
          memory: 512M

  mongo:
    image: mongo:7.0
    container_name: mongo
    profiles: ["pb1"]
    environment:
      - MONGO_INITDB_DATABASE=quality_assurance
    ports:
      - "127.0.0.1:27017:27017"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  seaweedfs-data:
